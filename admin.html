<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARDOBU — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="style.css">
<style>.admin{max-width:1200px;margin:auto;padding:30px 5%}.admin-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding-bottom:20px}.panel{background:#101010;border:1px solid #222;padding:24px;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.stat{background:#161616;padding:18px;border:1px solid #222}.stat b{display:block;font-size:27px;margin-top:5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:#777;letter-spacing:2px;font-size:10px;margin-top:15px}.field input,.field textarea,.field select{width:100%;background:#171717;border:1px solid #333;color:#fff;padding:12px;margin-top:7px}.field textarea{min-height:80px}.row{display:grid;grid-template-columns:65px 1fr auto;gap:15px;align-items:center;padding:15px 0;border-top:1px solid #222}.thumb{width:65px;height:65px;background:#171717;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#555}.thumb img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:7px}.small{background:#181818;border:1px solid #444;color:#fff;padding:8px 11px}.danger{color:#ff9999}.muted{color:#777;font-size:12px}.login{max-width:420px;margin:12vh auto;padding:28px;background:#101010;border:1px solid #292929}.login input{width:100%;background:#171717;border:1px solid #333;color:#fff;padding:13px;margin-top:7px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.row{grid-template-columns:55px 1fr}.actions{grid-column:2}.thumb{width:55px;height:55px}}</style>
</head>
<body>
<div id="login" class="login"><div class="logo">KARDOBU<span>.</span></div><p class="eyebrow">ADMIN PANEL</p><h2>Store Management</h2><label>Email</label><input id="email" type="email" placeholder="admin@email.com"><label>Password</label><input id="password" type="password"><button class="button full" onclick="login()">LOGIN</button><p id="err" class="muted"></p></div>
<div id="app" class="admin hidden">
<div class="admin-head"><div><div class="logo">KARDOBU<span>.</span></div><small class="eyebrow">ADMIN DASHBOARD</small></div><button class="small" onclick="logout()">LOGOUT</button></div>
<div class="stats"><div class="stat"><span class="muted">PRODUCTS</span><b id="sp">0</b></div><div class="stat"><span class="muted">ORDERS</span><b id="so">0</b></div><div class="stat"><span class="muted">PENDING</span><b id="spp">0</b></div><div class="stat"><span class="muted">PAID</span><b id="spa">0</b></div></div>
<div class="panel"><p class="eyebrow">PRODUCT MANAGEMENT</p><h2 id="formTitle">Tambah Produk</h2><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>NAMA</label><input id="name"></div><div class="field"><label>HARGA</label><input id="price" type="number"></div><div class="field"><label>STATUS</label><select id="status"><option>READY</option><option>PRE-ORDER</option><option>SOLD OUT</option></select></div><div class="field"><label>STOCK</label><input id="stock" type="number" value="0"></div><div class="field"><label>UKURAN</label><input id="sizes" value="S,M,L,XL"></div><div class="field"><label>FEATURED</label><select id="featured"><option value="false">Tidak</option><option value="true">Ya</option></select></div><div class="field" style="grid-column:1/-1"><label>URL FOTO</label><input id="image"></div><div class="field" style="grid-column:1/-1"><label>DESKRIPSI</label><textarea id="description"></textarea></div></div><button class="button" onclick="saveProduct()">SIMPAN</button><button class="small" onclick="resetForm()">BATAL</button></div>
<div class="panel"><p class="eyebrow">CATALOG</p><div id="products"></div></div>
<div class="panel"><p class="eyebrow">ORDERS</p><div id="orders"></div></div>
<div class="panel"><p class="eyebrow">STORE SETTINGS</p><div class="field"><label>WHATSAPP</label><input id="wa"></div><div class="field"><label>INSTAGRAM</label><input id="ig"></div><div class="field"><label>QRIS IMAGE URL</label><input id="qris"></div><div class="field"><label>HERO SUBTITLE</label><input id="sub"></div><button class="button" onclick="saveSettings()">SIMPAN PENGATURAN</button></div>
</div>
<script>
const SUPABASE_URL="https://xidiyskrefayaimgoiyp.supabase.co";const SUPABASE_KEY="sb_publishable_oy8rGLDWEFzCboJWyUwS3A_UzbAPCbW";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function login(){const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){err.textContent=error.message;return}show()}
async function logout(){await db.auth.signOut();location.reload()}
async function show(){login.classList.add("hidden");app.classList.remove("hidden");await Promise.all([loadProducts(),loadOrders(),loadSettings()])}
async function session(){const {data}=await db.auth.getSession();if(data.session)show()}session();
async function loadProducts(){const r=await db.from("products").select("*").order("created_at",{ascending:false});if(r.error)return alert(r.error.message);sp.textContent=r.data.length;products.innerHTML=r.data.map(p=>`<div class="row"><div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}">`:"KARDOBU"}</div><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · ${p.status} · Stock ${p.stock}</div></div><div class="actions"><button class="small" onclick="editProduct('${p.id}')">Edit</button><button class="small danger" onclick="delProduct('${p.id}')">Hapus</button></div></div>`).join("")}
async function saveProduct(){const obj={name:name.value.trim(),price:Number(price.value),status:status.value,stock:Number(stock.value),sizes:sizes.value.split(",").map(x=>x.trim()).filter(Boolean),featured:featured.value==="true",image_url:image.value.trim(),description:description.value.trim()};if(!obj.name||!obj.price)return alert("Nama dan harga wajib diisi.");const id=document.getElementById("id").value;const r=id?await db.from("products").update(obj).eq("id",id):await db.from("products").insert(obj);if(r.error)return alert(r.error.message);resetForm();loadProducts()}
async function editProduct(id){const r=await db.from("products").select("*").eq("id",id).single();if(r.error)return alert(r.error.message);const p=r.data;document.getElementById("id").value=p.id;name.value=p.name;price.value=p.price;status.value=p.status;stock.value=p.stock;sizes.value=(p.sizes||[]).join(",");featured.value=String(p.featured);image.value=p.image_url||"";description.value=p.description||"";formTitle.textContent="Edit Produk";scrollTo({top:0,behavior:"smooth"})}
async function delProduct(id){if(!confirm("Hapus produk ini?"))return;const r=await db.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else loadProducts()}
function resetForm(){document.getElementById("id").value="";name.value="";price.value="";status.value="READY";stock.value=0;sizes.value="S,M,L,XL";featured.value="false";image.value="";description.value="";formTitle.textContent="Tambah Produk"}
async function loadOrders(){const r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)return;so.textContent=r.data.length;spp.textContent=r.data.filter(x=>x.payment_status==="PENDING").length;spa.textContent=r.data.filter(x=>x.payment_status==="PAID").length;orders.innerHTML=r.data.map(o=>`<div class="row" style="grid-template-columns:1fr"><div><b>${esc(o.order_code)}</b><div class="muted">${esc(o.customer_name)} · ${esc(o.customer_phone)} · ${money(o.total_amount)}</div><select onchange="updateOrder('${o.id}',this.value)"><option value="PENDING" ${o.payment_status==="PENDING"?"selected":""}>MENUNGGU PEMBAYARAN</option><option value="WAITING_CONFIRMATION" ${o.payment_status==="WAITING_CONFIRMATION"?"selected":""}>MENUNGGU KONFIRMASI</option><option value="PAID" ${o.payment_status==="PAID"?"selected":""}>SUDAH BAYAR</option><option value="CANCELLED" ${o.payment_status==="CANCELLED"?"selected":""}>DIBATALKAN</option></select></div></div>`).join("")}
async function updateOrder(id,status){const r=await db.from("orders").update({payment_status:status}).eq("id",id);if(r.error)alert(r.error.message);else loadOrders()}
async function loadSettings(){const r=await db.from("store_settings").select("*").eq("id",1).single();if(r.error)return;wa.value=r.data.whatsapp_number||"";ig.value=r.data.instagram||"";qris.value=r.data.qris_image_url||"";sub.value=r.data.hero_subtitle||""}
async function saveSettings(){const r=await db.from("store_settings").update({whatsapp_number:wa.value.trim(),instagram:ig.value.trim(),qris_image_url:qris.value.trim(),hero_subtitle:sub.value.trim()}).eq("id",1);if(r.error)alert(r.error.message);else alert("Pengaturan tersimpan.")}
</script>
</body></html>
