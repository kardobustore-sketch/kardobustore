<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARDOBU — Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<div id="login" class="login"><div class=logo>KARDOBU<span>.</span></div><div class=eyebrow>ADMIN PANEL</div><h1>Store Management</h1><p class=muted>Login admin KARDOBU.</p><label>EMAIL</label><input id=email type=email value="kardobustore@gmail.com"><label>PASSWORD</label><input id=password type=password><button class="button full" onclick=login()>MASUK ADMIN</button><p id=error class=error></p></div>
<div id=app class="admin hidden"><div class=head><div><div class=logo>KARDOBU<span>.</span></div><div class=eyebrow>ADMIN DASHBOARD</div><div id=who class=muted></div></div><button class=small onclick=logout()>LOGOUT</button></div>
<div class=stats><div class=stat>PRODUCTS<b id=sp>0</b></div><div class=stat>ORDERS<b id=so>0</b></div><div class=stat>PENDING<b id=spp>0</b></div><div class=stat>PAID<b id=spa>0</b></div></div>
<div class=panel><div class=eyebrow>PRODUCT MANAGEMENT</div><h2 id=ft>Tambah Produk</h2><input type=hidden id=pid><div class=formgrid><div><label>NAMA</label><input id=pname></div><div><label>HARGA</label><input id=price type=number></div><div><label>STATUS</label><select id=status><option>READY</option><option>PRE-ORDER</option><option>SOLD OUT</option></select></div><div><label>STOCK</label><input id=stock type=number value=0></div><div><label>UKURAN</label><input id=sizes value="S,M,L,XL"></div><div><label>FEATURED</label><select id=featured><option value=false>Tidak</option><option value=true>Ya</option></select></div><div><label>URL FOTO</label><input id=image></div><div><label>DESKRIPSI</label><textarea id=desc></textarea></div></div><button class=button onclick=saveProduct()>SIMPAN PRODUK</button> <button class=small onclick=resetForm()>BATAL</button></div>
<div class=panel><div class=eyebrow>CATALOG</div><h2>Produk KARDOBU</h2><div id=plist>Memuat...</div></div>
<div class=panel><div class=eyebrow>ORDERS</div><h2>Pesanan Masuk</h2><div id=olist>Memuat...</div></div>
<div class=panel><div class=eyebrow>STORE SETTINGS</div><h2>Pengaturan Toko</h2><div class=formgrid><div><label>WHATSAPP TOKO</label><input id=wa placeholder="628xxxxxxxxxx"></div><div><label>INSTAGRAM</label><input id=ig></div><div><label>URL QRIS</label><input id=qris></div><div><label>HERO SUBTITLE</label><input id=sub></div></div><button class=button onclick=saveSettings()>SIMPAN PENGATURAN</button></div></div>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function login(){error.textContent="Memeriksa akun...";let r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){error.textContent="Login gagal: "+r.error.message;return}if((r.data.user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();error.textContent="Email ini bukan akun admin KARDOBU.";return}show(r.data.user)}
async function show(u){login.classList.add("hidden");app.classList.remove("hidden");who.textContent="Login sebagai: "+u.email;await Promise.all([loadProducts(),loadOrders(),loadSettings()])}
async function boot(){let r=await db.auth.getSession();if(r.data.session&&r.data.session.user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase())show(r.data.session.user)}boot()
async function logout(){await db.auth.signOut();location.reload()}
async function loadProducts(){let r=await db.from("products").select("*").order("created_at",{ascending:false});if(r.error){plist.innerHTML="<p class=error>"+esc(r.error.message)+"</p>";return}sp.textContent=r.data.length;plist.innerHTML=r.data.length?r.data.map(p=>`<div class=row><div class=thumb>${p.image_url?`<img src="${esc(p.image_url)}">`:"KARDOBU"}</div><div><b>${esc(p.name)}</b><div class=muted>${money(p.price)} · ${esc(p.status)} · Stock ${p.stock}</div></div><div class=actions><button class=small onclick="editProduct('${p.id}')">EDIT</button><button class="small danger" onclick="delProduct('${p.id}')">HAPUS</button></div></div>`).join(""):"<p class=muted>Belum ada produk.</p>"}
async function saveProduct(){let obj={name:pname.value.trim(),slug:pname.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now(),description:desc.value.trim(),price:Number(price.value||0),status:status.value,stock:Number(stock.value||0),sizes:sizes.value.split(",").map(x=>x.trim()).filter(Boolean),featured:featured.value==="true",image_url:image.value.trim()};if(!obj.name||!obj.price)return alert("Nama dan harga wajib diisi.");let r=pid.value?await db.from("products").update(obj).eq("id",pid.value):await db.from("products").insert(obj);if(r.error)return alert(r.error.message);resetForm();loadProducts()}
async function editProduct(id){let r=await db.from("products").select("*").eq("id",id).single();if(r.error)return alert(r.error.message);let p=r.data;pid.value=p.id;pname.value=p.name;price.value=p.price;status.value=p.status;stock.value=p.stock;sizes.value=(p.sizes||[]).join(",");featured.value=String(p.featured);image.value=p.image_url||"";desc.value=p.description||"";ft.textContent="Edit Produk";scrollTo({top:0,behavior:"smooth"})}
async function delProduct(id){if(!confirm("Hapus produk?"))return;let r=await db.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else loadProducts()}
function resetForm(){pid.value="";pname.value="";price.value="";status.value="READY";stock.value=0;sizes.value="S,M,L,XL";featured.value="false";image.value="";desc.value="";ft.textContent="Tambah Produk"}
async function loadOrders(){let r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error){olist.innerHTML="<p class=error>"+esc(r.error.message)+"</p>";return}so.textContent=r.data.length;spp.textContent=r.data.filter(x=>x.payment_status==="PENDING").length;spa.textContent=r.data.filter(x=>x.payment_status==="PAID").length;olist.innerHTML=r.data.length?r.data.map(o=>`<div class=order><b>${esc(o.order_code)}</b><div class=muted>${esc(o.customer_name)} · ${esc(o.customer_phone)} · ${money(o.total_amount)}</div><div class=muted>${esc(o.customer_address)}</div><select onchange="updateOrder('${o.id}',this.value)"><option ${o.payment_status==="PENDING"?"selected":""}>PENDING</option><option value=WAITING_CONFIRMATION ${o.payment_status==="WAITING_CONFIRMATION"?"selected":""}>MENUNGGU KONFIRMASI</option><option ${o.payment_status==="PAID"?"selected":""}>PAID</option><option ${o.payment_status==="CANCELLED"?"selected":""}>CANCELLED</option></select></div>`).join(""):"<p class=muted>Belum ada pesanan.</p>"}
async function updateOrder(id,status){let r=await db.from("orders").update({payment_status:status}).eq("id",id);if(r.error)alert(r.error.message);else loadOrders()}
async function loadSettings(){let r=await db.from("store_settings").select("*").eq("id",1).single();if(r.error)return;wa.value=r.data.whatsapp_number||"";ig.value=r.data.instagram||"";qris.value=r.data.qris_image_url||"";sub.value=r.data.hero_subtitle||""}
async function saveSettings(){let r=await db.from("store_settings").update({whatsapp_number:wa.value.trim(),instagram:ig.value.trim(),qris_image_url:qris.value.trim(),hero_subtitle:sub.value.trim()}).eq("id",1);if(r.error)alert(r.error.message);else alert("Pengaturan tersimpan.")}
</script></body></html>
