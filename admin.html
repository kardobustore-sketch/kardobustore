<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KARDOBU — Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    color:#fff;
}

.eyebrow{
    font-size:10px;
    letter-spacing:3px;
    color:#777;
    margin:6px 0;
}

/* =========================
   LOGIN
========================= */

.login-screen{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#101010;
    border:1px solid #292929;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.login-box h1{
    margin:10px 0 5px;
    font-size:28px;
}

.login-box p{
    color:#777;
}

label{
    display:block;
    color:#aaa;
    font-size:11px;
    letter-spacing:2px;
    margin-top:18px;
}

input,
textarea,
select{
    width:100%;
    margin-top:7px;
    padding:13px;
    border:1px solid #333;
    background:#171717;
    color:#fff;
    outline:none;
    border-radius:4px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#777;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    background:#fff;
    color:#000;
    font-weight:800;
    letter-spacing:1px;
    border-radius:4px;
}

.button:hover{
    opacity:.85;
}

.error{
    color:#ff8d8d !important;
    font-size:13px;
    margin-top:15px;
}

/* =========================
   ADMIN
========================= */

.admin{
    max-width:1250px;
    margin:auto;
    padding:25px 20px 60px;
}

.admin-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding-bottom:20px;
    border-bottom:1px solid #222;
}

.admin-user{
    color:#777;
    font-size:12px;
    margin-top:7px;
}

.small{
    background:#151515;
    color:#fff;
    border:1px solid #444;
    padding:9px 13px;
    border-radius:4px;
}

.small:hover{
    background:#222;
}

.danger{
    color:#ff9999;
}

.panel{
    background:#101010;
    border:1px solid #222;
    padding:24px;
    margin-top:20px;
    border-radius:5px;
}

.panel h2{
    margin:8px 0 15px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:20px;
}

.stat{
    background:#111;
    border:1px solid #242424;
    padding:20px;
}

.stat span{
    color:#777;
    font-size:11px;
    letter-spacing:2px;
}

.stat b{
    display:block;
    font-size:30px;
    margin-top:8px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px 15px;
}

.full-field{
    grid-column:1/-1;
}

.form-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.form-buttons .button{
    width:auto;
    margin-top:0;
}

.form-buttons .small{
    padding:14px 20px;
}

/* =========================
   PRODUCTS
========================= */

.row{
    display:grid;
    grid-template-columns:70px 1fr auto;
    gap:15px;
    align-items:center;
    padding:15px 0;
    border-top:1px solid #222;
}

.thumb{
    width:70px;
    height:70px;
    background:#171717;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:#555;
    font-size:10px;
    text-align:center;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.actions{
    display:flex;
    gap:7px;
}

.muted{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

/* =========================
   ORDER
========================= */

.order{
    border-top:1px solid #222;
    padding:18px 0;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.order-code{
    font-weight:bold;
    font-size:16px;
}

.order-info{
    color:#aaa;
    font-size:13px;
    line-height:1.7;
    margin-top:5px;
}

.order-status{
    max-width:280px;
    margin-top:10px;
}

/* =========================
   SETTINGS
========================= */

.setting-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px 15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .admin{
        padding:18px 12px 50px;
    }

    .admin-head{
        align-items:flex-start;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .form-grid,
    .setting-grid{
        grid-template-columns:1fr;
    }

    .full-field{
        grid-column:auto;
    }

    .row{
        grid-template-columns:55px 1fr;
    }

    .thumb{
        width:55px;
        height:55px;
    }

    .actions{
        grid-column:2;
    }

    .order-top{
        display:block;
    }

    .order-status{
        max-width:100%;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="logo">
            KARDOBU<span>.</span>
        </div>

        <div class="eyebrow">
            ADMIN PANEL
        </div>

        <h1>Store Management</h1>

        <p>
            Login menggunakan akun administrator KARDOBU.
        </p>

        <label for="email">
            EMAIL
        </label>

        <input
            id="email"
            type="email"
            placeholder="kardobustore@gmail.com"
            autocomplete="email"
        >

        <label for="password">

        </label>

        <input
            id="password"
            type="password"
            placeholder="Password"

        >

        <button

            onclick="adminLogin()"
        >
            MASUK ADMIN
        </button>

        <p
            id="loginError"
            class="error"
        ></p>

    </div>

</div>


<!-- =====================================================
     ADMIN DASHBOARD
===================================================== -->

<div id="adminApp" class="admin hidden">

    <!-- HEADER -->

    <div class="admin-head">

        <div>

            <div class="logo">
                KARDOBU<span>.</span>
            </div>

            <div class="eyebrow">
                ADMIN DASHBOARD
            </div>

            <div
                id="adminEmail"
                class="admin-user"
            ></div>

        </div>

        <button
            class="small"
            onclick="adminLogout()"
        >
            LOGOUT
        </button>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat">

            <span>
                PRODUCTS
            </span>

            <b id="statProducts">
                0
            </b>

        </div>

        <div class="stat">

            <span>
                ORDERS
            </span>

            <b id="statOrders">
                0
            </b>

        </div>

        <div class="stat">

            <span>
                PENDING
            </span>

            <b id="statPending">
                0
            </b>

        </div>

        <div class="stat">

            <span>
                PAID
            </span>

            <b id="statPaid">
                0
            </b>

        </div>

    </div>


    <!-- =================================================
         PRODUCT MANAGEMENT
    ================================================== -->

    <div class="panel">

        <div class="eyebrow">
            PRODUCT MANAGEMENT
        </div>

        <h2 id="formTitle">
            Tambah Produk
        </h2>

        <input
            type="hidden"
            id="productId"
        >

        <div class="form-grid">

            <div>

                <label>
                    NAMA PRODUK
                </label>

                <input
                    id="productName"

            </div>


            <div>

                <input

                        READY

                    <option value="PRE-ORDER">

            </div>

            <div class="full-field">

    <!-- =================================================
         PRODUCT LIST
    ================================================== -->

    <div class="panel">

        <div class="eyebrow">

        <h2>

        </h2>

        </div>

    <!-- =================================================
         ORDERS

    <div class="panel">

    <!-- =================================================

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xidiyskrefayaimgoiyp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_oy8rGLDWEFzCboJWyUwS3A_UzbAPCbW";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   HELPER
===================================================== */

function money(number){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(Number(number) || 0);

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, function(character){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[character];

        });

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function adminLogin(){

    const email =
        document.getElementById("email")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    const errorBox =
        document.getElementById("loginError");


    errorBox.textContent = "";


    if(!email || !password){

        errorBox.textContent =
            "Email dan password wajib diisi.";

        return;
    }


    errorBox.textContent =
        "Memeriksa akun...";


    const result =
        await db.auth.signInWithPassword({

            email:email,

            password:password

        });


    if(result.error){

        console.error(result.error);

        errorBox.textContent =
            "Login gagal: " +
            result.error.message;

        return;
    }


    const user =
        result.data.user;


    if(!user){

        errorBox.textContent =
            "User tidak ditemukan.";

        return;
    }


    /*
       CEK TABEL ADMIN_USERS
    */

    const adminResult =
        await db
            .from("admin_users")
            .select("id,email,role")
            .eq("id",user.id)
            .eq("role","admin")
            .maybeSingle();


    if(adminResult.error){

        console.error(
            adminResult.error
        );

        await db.auth.signOut();

        errorBox.textContent =
            "Gagal memeriksa admin: " +
            adminResult.error.message;

        return;
    }


    if(!adminResult.data){

        await db.auth.signOut();

        errorBox.textContent =
            "Akun berhasil login, tetapi akun ini bukan ADMIN KARDOBU.";

        return;
    }


    /*
       ADMIN VALID
    */

    showAdmin(
        user.email
    );

}


/* =====================================================
   SHOW ADMIN
===================================================== */

async function showAdmin(email){

    document
        .getElementById("loginScreen")
        .classList.add("hidden");


    document
        .getElementById("adminApp")
        .classList.remove("hidden");


    document
        .getElementById("adminEmail")
        .textContent =
            "Login sebagai: " + email;


    await Promise.all([

        loadProducts(),

        loadOrders(),

        loadSettings()

    ]);

}


/* =====================================================
   CEK SESSION
===================================================== */

async function checkSession(){

    const result =
        await db.auth.getSession();


    if(
        result.error ||
        !result.data.session
    ){

        return;
    }


    const user =
        result.data.session.user;


    const adminResult =
        await db
            .from("admin_users")
            .select("id,email,role")
            .eq("id",user.id)
            .eq("role","admin")
            .maybeSingle();


    if(!adminResult.data){

        await db.auth.signOut();

        return;
    }


    showAdmin(
        user.email
    );

}


checkSession();


/* =====================================================
   LOGOUT
===================================================== */

async function adminLogout(){

    await db.auth.signOut();

    location.reload();

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const result =
        await db
            .from("products")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(result.error){

        document
            .getElementById("productsList")
            .innerHTML =
            `<p class="error">
                ${escapeHTML(result.error.message)}
            </p>`;

        return;
    }


    const products =
        result.data || [];


    document
        .getElementById("statProducts")
        .textContent =
            products.length;


    if(products.length === 0){

        document
            .getElementById("productsList")
            .innerHTML =
                `<p class="muted">
                    Belum ada produk.
                </p>`;

        return;
    }


    document
        .getElementById("productsList")
        .innerHTML =

        products.map(function(product){

            return `

                <div class="row">

                    <div class="thumb">

                        ${
                            product.image_url

                            ?

                            `<img
                                src="${escapeHTML(product.image_url)}"
                                alt="${escapeHTML(product.name)}"
                            >`

                            :

                            "KARDOBU"
                        }

                    </div>


                    <div>

                        <b>
                            ${escapeHTML(product.name)}
                        </b>

                        <div class="muted">

                            ${money(product.price)}

                            ·

                            ${escapeHTML(product.status)}
